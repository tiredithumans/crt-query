[package]
name = "crt-query"
version = "0.5.2"
edition = "2024"
rust-version = "1.98"
description = "Query crt.sh certificate-transparency data directly from its public PostgreSQL database"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tiredithumans/crt-query"
homepage = "https://github.com/tiredithumans/crt-query"
documentation = "https://github.com/tiredithumans/crt-query#readme"
# Shipped as release binaries (directly, through Homebrew or the install
# scripts) or built from source with `cargo install --git`. It is not on
# crates.io, and the README never offers `cargo install crt-query`. This keeps a
# stray `cargo publish` from putting it there by accident, and it is why the
# manifest carries no keywords, categories or exclude list: those only shape a
# crates.io listing and a packaged tarball that do not exist.
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# One connection, one spawned driver task: the current-thread runtime is the
# whole requirement, so the multi-threaded worker pool is not pulled in.
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
toml = "1.1.6"

[profile.release]
lto = "thin"
strip = true
