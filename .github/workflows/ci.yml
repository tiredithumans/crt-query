name: CI

# Every `uses:` is pinned to a full commit SHA with the readable version in a
# trailing comment: a tag is a movable pointer, and a compromised action runs
# with this workflow's token. Dependabot advances both SHA and comment (see
# dependabot.yml), so the pins stay fresh without ever being trusted by name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run: with cancel-in-progress below, an Actions outage can leave a
  # PR with cancelled checks and no other way to retry them.
  workflow_dispatch:
  schedule:
    # Weekly RustSec refresh, so an advisory filed after merge still reaches
    # us. The `scripts` and `actionlint` jobs opt out (see their `if:`); the
    # rest run free and occasionally catch a toolchain or dependency change
    # that nothing in the repo triggered.
    - cron: "0 6 * * 1"

# A push to a pull request supersedes its in-flight run: nobody merges the
# older head, so those cancel. A push to main is a commit that stays in the
# history, and cancelling its run left the first merge with no completed CI
# record at all — no way to tell afterwards whether it was ever green. So
# every other run gets a group of its own. Turning cancel-in-progress off
# alone would not be enough: a group holds one running and one pending run,
# and GitHub cancels the pending one when a third arrives, so three quick
# merges would still lose the middle one's run. Nothing here deploys, so
# main runs have nothing to serialise.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege, declared explicitly so a change to the repo-level default
# cannot silently re-broaden this workflow.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - name: Formatting
        run: just fmt-check
      - name: Clippy
        run: just lint
      # Every test is offline by design — crt.sh is a shared public service and
      # CI must never add load to it.
      - name: Tests
        run: just test
      # The old `just build` step compiled nothing new: the integration tests
      # build the debug binary themselves via CARGO_BIN_EXE. Rustdoc had no
      # gate, and a broken intra-doc link is a comment pointing at something
      # that is not there. Run on every leg: some items exist only under a
      # `#[cfg]` for one OS.
      - name: Docs
        run: just doc

      # The release profile (lto = "thin", strip = true) is otherwise compiled
      # for the first time by the tag push — after an annotated tag exists, and
      # with fail-fast disabled, so a bad leg leaves artifacts uploaded, the
      # draft skipped and a tag to delete. One Linux leg is enough to catch it.
      - name: Release profile builds
        if: runner.os == 'Linux'
        run: just build-release

      # The same reasoning for the musl target the release now ships static
      # Linux archives for: without this, the tag push is the first time it is
      # compiled at all. x86-64 only: the aarch64 musl row differs in CPU, not
      # in how it links, and the release checks both rows for static linking.
      - name: Static musl build
        if: runner.os == 'Linux'
        run: just build-musl

      # install.ps1 confirms a good install by running the binary it copied,
      # and `lint-scripts` only parses that file — a runtime fault in that
      # check passed every gate and broke every Windows install, which is
      # what happened. Run the real shape against the debug binary the Tests
      # step built; keep it in lockstep with the block in install.ps1.
      - name: install.ps1 verification shape runs clean
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $dest = 'target/debug/crt-query.exe'
          $versionOutput = & $dest --version 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $versionOutput) {
              throw "built $dest but it would not run"
          }
          $installed = @($versionOutput)[0]
          Write-Host "post-install check would report: $installed"

  scripts:
    name: Install scripts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      # shellcheck and pwsh are both preinstalled on the ubuntu runner image,
      # so the recipe below is the same command a contributor runs locally.
      - name: Lint install.sh, install.ps1 and generate.sh
        run: just lint-scripts

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No toolchain action here on purpose: the recipe reads rust-version out
      # of Cargo.toml and installs exactly that, so the gate cannot drift away
      # from the number the manifest advertises.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - name: Declared MSRV builds
        run: just msrv

  actionlint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workflow-file syntax gate: an unparseable workflow gives 0-second
      # "workflow file issue" runs and no other signal; this turns that into
      # a failing check. Pinned by version + checksum — there is no action to
      # SHA-pin here, so the tarball is verified instead.
      #
      # Not via taiki-e/install-action: its manifest does not carry actionlint,
      # and the cargo-binstall fallback cannot help (a Go program with no
      # crates.io entry — tried, it fails with "install-action does not
      # support actionlint@1.7.12"). Bump the version and the SHA-256 together.
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # RustSec advisory scan; ignore list lives in .cargo/audit.toml.
      # Version-pinned rather than left floating, for the reason the deny job
      # below documents: a CLI refactor can change flags under the gate and
      # flip it red or green for reasons that have nothing to do with any
      # advisory. Bump it deliberately, alongside a lockfile change.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just,cargo-audit@0.22.2
      - name: Audit
        run: just audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # License policy, crate sources and bans; config in deny.toml. Version-
      # pinned rather than @latest because cargo-deny's 0.20 CLI refactor
      # changed flag handling without warning.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just,cargo-deny@0.20.2
      - name: Deny
        run: just deny
