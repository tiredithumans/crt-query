name: CI

# Every `uses:` in this repo is pinned to a full commit SHA with the human-
# readable version in a trailing comment. A tag is a movable pointer: whoever
# controls the action's repo can repoint `v4` at new code, and a compromised
# action runs with this workflow's token. Dependabot (see dependabot.yml)
# advances both the SHA and the comment, so the pins stay fresh without ever
# being trusted by name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run: with cancel-in-progress below, an Actions outage can leave a
  # PR with cancelled checks and no other way to retry them.
  workflow_dispatch:
  schedule:
    # Weekly RustSec refresh, so an advisory filed after merge still reaches us.
    # The `scripts` and `actionlint` jobs opt out of this tick (see their `if:`
    # conditions); the rest run, which is free and occasionally catches a
    # toolchain or dependency change that nothing in the repo triggered.
    - cron: "0 6 * * 1"

# A new push to the same branch supersedes the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared explicitly so a change to the repo-level default
# cannot silently re-broaden this workflow.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      - name: Formatting
        run: just fmt-check
      - name: Clippy
        run: just lint
      # Every test is offline by design — crt.sh is a shared public service and
      # CI must never add load to it.
      - name: Tests
        run: just test
      - name: Build
        run: just build

      # The release profile (lto = "thin", strip = true) is otherwise compiled
      # for the first time by the tag push — after an annotated tag exists, and
      # with fail-fast disabled, so a bad leg leaves artifacts uploaded, the
      # draft skipped and a tag to delete. One Linux leg is enough to catch it.
      - name: Release profile builds
        if: runner.os == 'Linux'
        run: just build-release

      # install.ps1 confirms a good install by running the binary it just
      # copied. `lint-scripts` only parses that file, so a runtime fault in the
      # check itself passes every gate and then breaks every Windows install --
      # which is exactly what happened. Run the real shape against the binary
      # built above; keep it in lockstep with the block in install.ps1.
      - name: install.ps1 verification shape runs clean
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $dest = 'target/debug/crt-query.exe'
          $versionOutput = & $dest --version 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $versionOutput) {
              throw "built $dest but it would not run"
          }
          $installed = @($versionOutput)[0]
          Write-Host "post-install check would report: $installed"

  scripts:
    name: Install scripts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      # shellcheck and pwsh are both preinstalled on the ubuntu runner image,
      # so the recipe below is the same command a contributor runs locally.
      - name: Lint install.sh and install.ps1
        run: just lint-scripts

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No toolchain action here on purpose: the recipe reads rust-version out
      # of Cargo.toml and installs exactly that, so the gate cannot drift away
      # from the number the manifest advertises.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      - name: Declared MSRV builds
        run: just msrv

  actionlint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workflow-file syntax gate. An unparseable workflow produces 0-second
      # "workflow file issue" runs and no other signal; this turns that into a
      # failing check. install-action verifies the download's checksum itself,
      # which retires the hand-maintained SHA-256 that had to be edited by hand
      # on every version bump.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: actionlint@1.7.12
      - name: actionlint
        run: actionlint -color

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just,cargo-audit
      # RustSec advisory scan; ignore list lives in .cargo/audit.toml.
      - name: Audit
        run: just audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # License policy, crate sources and bans; config in deny.toml. Version-
      # pinned rather than @latest because cargo-deny's 0.20 CLI refactor
      # changed flag handling without warning.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just,cargo-deny@0.20.2
      - name: Deny
        run: just deny
