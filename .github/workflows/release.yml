name: Release

# Triggered by pushing an annotated `vX.Y.Z` tag: builds each target,
# assembles SHA256SUMS, and publishes a DRAFT release — a human publishes it,
# the only step that reaches users.
#
# Publishing fires `release: published`, which runs the `tap` job at the
# bottom. Two separate triggers on purpose: the formula is generated from
# SHA256SUMS fetched over the PUBLIC download URL, which serves nothing for a
# draft — and a draft fires no `release` event at all, so the draft job cannot
# trigger the tap job.
#
# Every `uses:` is pinned to a full commit SHA (see the note in ci.yml).

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tap_only:
        description: "Skip the build; only re-sync the Homebrew tap from the latest published release"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The oldest glibc a published -linux-gnu binary must load on: RHEL/Rocky 9
  # and Amazon Linux 2023 (2.34), Ubuntu 22.04 (2.35), Debian 12 (2.36). The
  # -linux-gnu rows are pinned to the runners that produce this floor, and
  # each build's `glibc floor` step fails the release if it rises; below it,
  # hosts get the static musl archives. README.md quotes this number and
  # install.sh (GLIBC_FLOOR there) acts on it; keep all three in step.
  GLIBC_FLOOR: GLIBC_2.34

jobs:
  # Refuse to build anything if the tag and the manifest disagree. Catching it
  # here costs seconds; catching it after publish means a yanked release.
  guard:
    name: Guard
    # The release-published and tap-only runs do no building; they start at
    # the `tap` job, and skipping this skips `build` and `draft` with it via
    # `needs`.
    #
    # Compared as a string against 'true' rather than `!inputs.tap_only`: the
    # `inputs` context is only populated on a manual run, and on the tag push
    # that cuts releases `github.event.inputs` is null, which compares unequal
    # here and lets the build proceed. The string form also sidesteps the
    # trap that makes the literal 'false' truthy — under `!`, an unticked
    # checkbox would skip the whole release.
    if: github.event_name != 'release' && github.event.inputs.tap_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml, and the changelog has an entry
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $MANIFEST"
            exit 1
          fi
          # The release notes are extracted from this exact header shape below,
          # so a missing section must fail here rather than ship empty notes.
          if ! grep -qE "^## \[$TAG\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both glibc rows pin an explicit 22.04 runner, not `ubuntu-latest`:
          # a binary inherits the glibc floor of the machine that linked it,
          # so `latest` silently raises it with every alias move — how v0.4.0
          # shipped binaries that could not start on Debian 12, RHEL 9 or
          # Ubuntu 22.04 (see GLIBC_FLOOR).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native ARM64 runner, so no cross-compilation toolchain is needed.
          # install.sh computes this target on every ARM64 Linux host, and
          # before this existed it resolved to an archive no release shipped.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Statically linked musl builds, for the two hosts the glibc rows
          # cannot serve: musl distributions such as Alpine, where the glibc
          # binary's PT_INTERP does not exist, and glibc older than
          # GLIBC_FLOOR, where it refuses to start. install.sh picks these for
          # both. No musl-tools step: rustc carries musl's CRT objects and
          # libc.a and links them itself, the runner's cc only drives the
          # link, and no dependency compiles C on Linux (`cc` is in the tree
          # for Haiku alone) — one that did would need musl-gcc, and ci.yml's
          # `just build-musl` would fail on it before a tag ever did. Same
          # pinned images as the glibc rows, for a toolchain that does not
          # move under a release, not for a floor: a static binary has none.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Native ARM64 on GitHub's Windows runner; before this row, Windows
          # on ARM ran the emulated x86-64 build. install.ps1 already asked
          # for this target first, so it picks the native build up with no
          # change beyond its comments.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Nothing else here ever runs a released Linux binary, so the property
      # that decides whether it starts at all had no gate: v0.4.0 shipped both
      # Linux archives requiring a NON-weak GLIBC_2.39 verneed (from
      # pidfd_spawnp/pidfd_getpid, reached through check-update's
      # `Command::new("curl")`), which ld.so treats as fatal — the binary
      # died before main below 2.39, and install.sh had already overwritten
      # the working copy by the time it found out.
      #
      # Assert the floor rather than the runner label: pinning the image is
      # what holds it today, this says so out loud, and it fails the release
      # instead of the user's install.
      #
      # Matched on the -linux-gnu suffix, not "linux": a musl binary has no
      # GLIBC_ verneeds at all, so the grep finds nothing and, under pipefail,
      # fails the step with a bare exit 1 and no annotation (tried against a
      # local musl build). The musl rows get the step below instead.
      - name: glibc floor
        if: endsWith(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/crt-query"
          required=$(readelf -V "$bin" | grep -oE 'GLIBC_2\.[0-9]+' | sort -u -t. -k2 -n)
          echo "$required"
          highest=$(printf '%s\n' "$required" | tail -1)
          worst=$(printf '%s\n%s\n' "$highest" "$GLIBC_FLOOR" | sort -t. -k2 -n | tail -1)
          if [ "$worst" != "$GLIBC_FLOOR" ]; then
            echo "::error::$bin requires $highest, above the supported floor $GLIBC_FLOOR."
            echo "::error::A runner image bump is the usual cause; see the GLIBC_FLOOR comment."
            exit 1
          fi
          echo "floor holds: highest required is $highest, at or below $GLIBC_FLOOR"

      # The musl archives exist for hosts where the glibc binary cannot start,
      # so they must need nothing from the host: no program interpreter, no
      # shared libraries. One that still named /lib/ld-musl-*.so.1 would start
      # on Alpine and nowhere else — and install.sh would be sending the
      # old-glibc hosts to an archive that fails on them exactly as the glibc
      # one does. rustc links musl targets statically by default today; this
      # is what fails the release if that default, or a flag somebody adds,
      # changes it. Both rows run natively, so the binary is run once too, the
      # way install.sh will.
      #
      # Checked by header rather than by `file`, whose wording differs between
      # versions ("static-pie linked" against "statically linked"). A static
      # PIE keeps a DYNAMIC segment for its own relocations, so that is not
      # the test; PT_INTERP and DT_NEEDED are.
      - name: musl build is statically linked
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/crt-query"
          # Captured whole, then searched without -q: grep -q exits at the first
          # match, readelf can then die of SIGPIPE, and under pipefail that turns
          # a found INTERP into a failed test that the `if` reads as absent.
          headers=$(readelf -lW "$bin")
          dynamic=$(readelf -dW "$bin")
          interp=$(printf '%s\n' "$headers" | grep -F 'INTERP' || true)
          needed=$(printf '%s\n' "$dynamic" | grep -F '(NEEDED)' || true)
          if [ -n "$interp" ] || [ -n "$needed" ]; then
            printf '%s\n' "$interp" "$needed"
            echo "::error::$bin is dynamically linked; the musl archives must be static to run on any Linux host."
            exit 1
          fi
          "$bin" --version
          "$bin" completions bash > /dev/null
          echo "static: no program interpreter, no shared libraries, and it runs"

      # One archive per target, named so a human can tell at a glance which
      # binary they downloaded: crt-query-v1.2.3-<target>.<ext>
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="crt-query-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/crt-query" "dist/$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          rm -rf "dist/$NAME"

      # PowerShell and .NET only. This used to be bash and 7-Zip, which
      # windows-latest carries; windows-11-arm is a partner image maintained
      # apart from GitHub's own, and while it lists both today, nothing
      # obliges it to keep doing so. pwsh is what every Windows step here
      # already relies on, and ZipFile ships inside it.
      #
      # ZipFile.CreateFromDirectory rather than Compress-Archive: .NET writes
      # entry names with the "/" the zip format specifies, and
      # includeBaseDirectory ($true below) keeps the layout install.ps1
      # extracts and then looks inside for — one top-level
      # crt-query-<tag>-<target>/ holding the exe and the three documents.
      # Compress-Archive documents the layout but not the separator, and a
      # backslash one unpacks as flat, oddly named files anywhere but Windows.
      # The layout is read back afterwards regardless: a wrong one breaks
      # every Windows install and nothing else here would notice.
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $name = "crt-query-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $dist = (New-Item -ItemType Directory -Path dist -Force).FullName
          $stage = (New-Item -ItemType Directory -Path (Join-Path $dist $name) -Force).FullName
          Copy-Item -Path "target/${{ matrix.target }}/release/crt-query.exe" -Destination $stage
          Copy-Item -Path README.md, LICENSE-MIT, LICENSE-APACHE -Destination $stage

          # Both rows build on a native runner, so the binary can be run here:
          # an exe for the wrong architecture fails now rather than on install.
          $exe = Join-Path $stage 'crt-query.exe'
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "$exe did not run" }
          Write-Host "packaging $version"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $dist "$name.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $stage, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          Remove-Item -Path $stage -Recurse -Force

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
              $entries = @($archive.Entries | ForEach-Object { $_.FullName })
          } finally {
              $archive.Dispose()
          }
          $expected = @('crt-query.exe', 'README.md', 'LICENSE-MIT', 'LICENSE-APACHE' |
              ForEach-Object { "$name/$_" })
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $entries -CaseSensitive) {
              throw "$name.zip holds [$($entries -join ', ')], expected [$($expected -join ', ')]"
          }
          Write-Host "$name.zip: $($entries -join ', ')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crt-query-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that needs write access, and only to create the draft.
    # id-token and attestations are what let the run sign a provenance
    # statement for the archives it just built.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # SHA256SUMS proves the archives agree with each other but is served
      # from the same release, so it says nothing about where they came from.
      # The attestation is signed by the workflow run itself — the one link a
      # downloader cannot otherwise verify, worth having because the install
      # scripts replace a running binary after checking it against a
      # SHA256SUMS fetched from that same release. (No self-update is
      # deliberate; see src/update.rs and README.md.) Verify with:
      #   gh attestation verify <archive> --repo tiredithumans/crt-query
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      # Notes come from the changelog section the guard job already verified
      # exists, so the release page and CHANGELOG.md can never disagree.
      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          # Stop at the next version header OR at the trailing link-definition
          # block — the newest release has no section after it, so without the
          # second rule the extraction runs to EOF and swallows the links.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] - " { inside = 1; next }
            inside && /^## \[/        { exit }
            inside && /^\[[^]]+\]: /  { exit }
            inside                    { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "--- notes ---"; cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: v${{ needs.guard.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true

  # Publishing does not by itself change what `brew install` serves: the
  # formula lives in a separate tap repo, and copying it across was a manual
  # step at the end of the release checklist. It was missed three times —
  # v0.4.1, v0.5.0 and v0.5.1 shipped while the tap sat on v0.4.0 — so it is
  # automated here rather than written down again.
  #
  # Runs on publish, never on the tag push: generate.sh fetches SHA256SUMS
  # over the public download URL, and a draft serves nothing there.
  tap:
    name: Update Homebrew tap
    # A pre-release fires `published` too — `released` is the type that skips
    # them, and a pre-release published from a draft fires `published` either
    # way. The tap has no channels: one Formula/crt-query.rb is what every
    # `brew upgrade` follows, so a soft-launched version would land on
    # everyone. Every other install path ignores pre-releases for free via
    # /releases/latest (both install scripts with no tag, and check-update);
    # this is the one path that has to check the flag itself.
    #
    # Parenthesised because `&&` binds tighter than `||`: bare, the clause
    # attaches to the tap_only branch and leaves the release path unguarded.
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease)
      || github.event.inputs.tap_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nothing here writes to THIS repository; the tap is reached with its own
    # token below, because GITHUB_TOKEN is scoped to this repo alone.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail with the fix rather than with a 404 from the tap checkout further
      # down, which is what a missing secret otherwise looks like.
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is unset. Create a fine-grained PAT with Contents: read and write on tiredithumans/homebrew-tap, then add it to this repository as a secret named TAP_TOKEN."
            exit 1
          fi

      # A manual re-sync passes no tag, and generate.sh then resolves
      # /releases/latest — which is what a re-sync is asking for anyway.
      #
      # The formula is gitignored, so the checkout above holds no copy and
      # every step below reads the file this one writes. A tracked copy would
      # hold whatever was last committed by hand — nothing pushes the result
      # back here — and it duly went stale.
      - name: Regenerate the formula from the published release
        id: gen
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ./packaging/homebrew/generate.sh ${TAG:+"$TAG"}
          # Read the tag back out of the generated file rather than trusting
          # the event, so every assertion below is about what the formula says.
          #
          # `|| true` sits outside the substitution deliberately: grep exits 1
          # when it matches nothing, pipefail hands that status to the
          # assignment, and `set -e` would then kill the step here — before
          # the message explaining why. That made the branch below
          # unreachable: the job died on a bare exit 1 with no annotation, on
          # a release that is already public.
          FORMULA_TAG=$(grep -m1 -oE 'releases/download/[^/"]+/' \
            packaging/homebrew/crt-query.rb | cut -d/ -f3) || true
          echo "formula points at ${FORMULA_TAG:-<nothing>}"
          if [ -z "$FORMULA_TAG" ]; then
            echo "::error::could not read a version out of the generated formula"
            exit 1
          fi
          # Matched loosely above, rejected precisely here, so the failure can
          # name what it found. The tap serves stable releases only.
          if ! printf '%s' "$FORMULA_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::formula points at $FORMULA_TAG, which is not a vX.Y.Z release; the tap serves stable releases only."
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$FORMULA_TAG" != "$TAG" ]; then
            echo "::error::formula points at $FORMULA_TAG but this release is $TAG"
            exit 1
          fi
          echo "tag=$FORMULA_TAG" >> "$GITHUB_OUTPUT"

      # generate.sh copies the checksums out of SHA256SUMS, so this reads that
      # file back independently: a suffix-matching slip in sum_for /
      # archive_for pairing a hash with the wrong archive would survive
      # generation and fail at `brew install`, the worst place to find out.
      - name: Formula checksums match the published SHA256SUMS
        env:
          TAG: ${{ steps.gen.outputs.tag }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -o SHA256SUMS \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS"
          url=""
          checked=0
          while IFS= read -r line; do
            case "$line" in
              *'url "http'*)
                url=${line#*url \"}; url=${url%\"*} ;;
              *'sha256 "'*)
                [ -n "$url" ] || continue
                sha=${line#*sha256 \"}; sha=${sha%\"*}
                name=${url##*/}
                want=$(awk -v n="$name" '{ f=$2; sub(/^\*?(\.\/)?/, "", f) } f == n { print $1 }' SHA256SUMS)
                if [ -z "$want" ]; then
                  echo "::error::$name is not in the published SHA256SUMS"; exit 1
                fi
                if [ "$want" != "$sha" ]; then
                  echo "::error::$name: formula says $sha, the release says $want"; exit 1
                fi
                echo "ok  $name"
                checked=$((checked + 1))
                url="" ;;
            esac
          done < packaging/homebrew/crt-query.rb
          # Four url/sha256 pairs: two macOS, two glibc Linux. The release
          # ships more archives than that, but the musl and Windows ones have
          # no place in the formula, and generate.sh matches each target by
          # its whole suffix, so -linux-gnu.tar.gz can never pick up a
          # -linux-musl one. A parse that silently found none would otherwise
          # pass this step by checking nothing; one that found a fifth means
          # the formula changed shape and this step wants another look.
          if [ "$checked" -ne 4 ]; then
            echo "::error::checked $checked url/sha256 pairs, expected 4"; exit 1
          fi

      # The property no other gate in this repo covers, and the one that
      # breaks installs outright: Homebrew RUNS the installed binary — once
      # through generate_completions_from_executable, again in `test do`. A
      # formula naming a subcommand the released binary lacks aborts `brew
      # install`; generate.sh says so in its MIN_COMPLETIONS_VERSION comment,
      # this is the check that enforces it.
      - name: The released binary answers every call the formula makes
        env:
          TAG: ${{ steps.gen.outputs.tag }}
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://[^"]+x86_64-unknown-linux-gnu\.tar\.gz' \
            packaging/homebrew/crt-query.rb)
          curl --fail --silent --show-error --location -o linux.tar.gz "$url"
          # Checked against the SHA256SUMS the previous step already fetched and
          # matched, so this runs the archive the formula points at, not merely
          # one with the same name.
          want=$(awk -v n="${url##*/}" '{ f=$2; sub(/^\*?(\.\/)?/, "", f) } f == n { print $1 }' SHA256SUMS)
          echo "$want  linux.tar.gz" | sha256sum -c -
          mkdir -p unpacked && tar xzf linux.tar.gz -C unpacked --strip-components=1
          bin=unpacked/crt-query
          # `test do`: the version Homebrew scans out of the URL, and the string
          # the help assertion matches.
          "$bin" --version
          "$bin" --version | grep -qF "${TAG#v}"
          "$bin" --help | grep -qF 'certificate-transparency'
          # Only when the formula actually calls it: generate.sh omits the
          # completions block for releases older than `crt-query completions`.
          if grep -q 'generate_completions_from_executable' packaging/homebrew/crt-query.rb; then
            for shell in bash zsh fish; do
              "$bin" completions "$shell" > /dev/null
            done
            echo "completions ok for bash, zsh and fish"
          else
            echo "formula declares no completions block; nothing to exercise"
          fi

      # Everything above checks what the formula POINTS AT. This checks the
      # formula parses: generate.sh builds it by shell interpolation into a
      # heredoc, so a stray quote yields a file wrong in a way no checksum
      # notices. `brew audit --strict --online` is the real gate and needs the
      # formula inside a tapped tap, so that stays manual (see
      # packaging/homebrew/README.md); a syntax check is the part here.
      - name: The formula is syntactically valid Ruby
        run: ruby -c packaging/homebrew/crt-query.rb

      # The archive users are about to be pointed at was built by this repo's
      # release run, not merely uploaded to it.
      - name: Provenance of the archive the formula points at
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify linux.tar.gz --repo "$GITHUB_REPOSITORY"

      # persist-credentials stays on here, unlike everywhere else in this repo:
      # this is the one checkout that has to push.
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tiredithumans/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Copy the formula across
        env:
          TAG: ${{ steps.gen.outputs.tag }}
        run: |
          set -euo pipefail
          install -D packaging/homebrew/crt-query.rb tap/Formula/crt-query.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged first, then compared against the index rather than the
          # worktree. `git diff --quiet` reports a brand-new file as unchanged,
          # because an untracked path has nothing to diff against — so a tap
          # that does not carry the formula yet would report "nothing to push"
          # and silently skip, which is the exact failure this job exists to
          # end. Comparing the index sees the addition.
          git add Formula/crt-query.rb
          # A re-run of an already-synced release is a no-op, not an empty
          # commit — `git commit` would otherwise fail the job the second time.
          if git diff --cached --quiet -- Formula/crt-query.rb; then
            echo "tap already serves $TAG; nothing to push"
            exit 0
          fi
          git commit -m "chore: update crt-query to $TAG" -m \
            "Generated by tiredithumans/crt-query release.yml from the published $TAG SHA256SUMS. Checksums cross-checked against it, and the released Linux binary was run for every call the formula makes at install and test time."
          git push
          echo "tap now serves $TAG"
