[package]
name = "crt-query"
version = "0.5.2"
edition = "2024"
rust-version = "1.98"
description = "Query crt.sh certificate-transparency data directly from its public PostgreSQL database"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tiredithumans/crt-query"
homepage = "https://github.com/tiredithumans/crt-query"
documentation = "https://github.com/tiredithumans/crt-query#readme"
# Shipped as release binaries (directly, through Homebrew or the install
# scripts) or built from source with `cargo install --git`. It is not on
# crates.io, and the README never offers `cargo install crt-query`. This keeps a
# stray `cargo publish` from putting it there by accident, and it is why the
# manifest carries no keywords, categories or exclude list: those only shape a
# crates.io listing and a packaged tarball that do not exist.
publish = false

[dependencies]
anyhow = "1.0.104"
# Default features off: `wasmbind` only matters on a wasm32 target this tool is
# never built for, and `oldtime` no longer does anything. `now` (which brings in
# `std`, and with it `alloc`) covers `Utc::now`, formatting and
# `to_rfc3339_opts`; `serde` is for the --json output and the cache file.
#
# This trims less than it looks. tokio-postgres's `with-chrono-0_4` turns on
# chrono's `clock` whatever this line says, so iana-time-zone and windows-link
# stay; and wasm-bindgen and js-sys stay in the lockfile, because
# iana-time-zone and whoami (through web-sys) still name them for wasm32. What
# goes is chrono asking for them itself.
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# One connection, one spawned driver task: the current-thread runtime is the
# whole requirement, so the multi-threaded worker pool is not pulled in.
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
# The config file is only ever read, through `toml::from_str` into a serde
# struct, so the default `display` feature (and the toml_writer crate behind
# it) is left out. `std` is left out too, and that is load-bearing rather than
# tidiness: in this toml stack it gates nothing but tests and a HashMap
# conversion, yet its weak `toml_writer?/std` and `indexmap?/std` entries were
# enough to keep toml_writer, indexmap, hashbrown and equivalent in Cargo.lock
# with `display` already off. Adding `std` back brings them back.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[profile.release]
lto = "thin"
strip = true
