name: Release

# Triggered by pushing an annotated `vX.Y.Z` tag. Builds a binary for each
# target, assembles SHA256SUMS, and publishes a DRAFT release. A human reviews
# the draft and publishes it — that final step is what reaches users.
#
# Every `uses:` is pinned to a full commit SHA (see the note in ci.yml).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to build anything if the tag and the manifest disagree. Catching it
  # here costs seconds; catching it after publish means a yanked release.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml, and the changelog has an entry
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $MANIFEST"
            exit 1
          fi
          # The release notes are extracted from this exact header shape below,
          # so a missing section must fail here rather than ship empty notes.
          if ! grep -qE "^## \[$TAG\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Native ARM64 runner, so no cross-compilation toolchain is needed.
          # install.sh computes this target on every ARM64 Linux host, and
          # before this existed it resolved to an archive no release shipped.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # One archive per target, named so a human can tell at a glance which
      # binary they downloaded: crt-query-v1.2.3-<target>.<ext>
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="crt-query-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/crt-query" "dist/$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          rm -rf "dist/$NAME"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="crt-query-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/crt-query.exe" "dist/$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          (cd dist && 7z a "$NAME.zip" "$NAME" >/dev/null)
          rm -rf "dist/$NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crt-query-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that needs write access, and only to create the draft.
    # id-token and attestations are what let the run sign a provenance
    # statement for the archives it just built.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # SHA256SUMS proves the archives agree with each other; it is served from
      # the same release, so it says nothing about where they came from. An
      # attestation is signed by the workflow run itself, which is the one link
      # a downloader cannot otherwise verify — and self-update replaces the
      # running binary with what this release publishes, so that link is worth
      # having. Verify with:
      #   gh attestation verify <archive> --repo tiredithumans/crt-query
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: artifacts/*

      # Notes come from the changelog section the guard job already verified
      # exists, so the release page and CHANGELOG.md can never disagree.
      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          # Stop at the next version header OR at the trailing link-definition
          # block — the newest release has no section after it, so without the
          # second rule the extraction runs to EOF and swallows the links.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] - " { inside = 1; next }
            inside && /^## \[/        { exit }
            inside && /^\[[^]]+\]: /  { exit }
            inside                    { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "--- notes ---"; cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: v${{ needs.guard.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
