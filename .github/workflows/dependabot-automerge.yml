name: Dependabot auto-merge

# Dependabot's weekly patch and minor bumps were merged by hand every time,
# although the required checks already decide whether they are safe. This
# turns on GitHub's auto-merge for them, so each one lands by itself once all
# required checks on main's branch protection pass. Semver-major bumps can
# break the API we build against, so they still wait for a human.
#
# `pull_request`, never `pull_request_target`: the PR's own code must never
# run with a write token. A Dependabot-triggered run gets a read-only
# GITHUB_TOKEN unless the job asks for more, which is why the job does.
#
# Branch protection requires PRs to be up to date, so when two Dependabot PRs
# arrive together the second falls behind once the first merges. Dependabot
# rebases its own PRs; do not press "Update branch", because Dependabot stops
# managing a PR anyone else has pushed to. `@dependabot rebase` is the manual
# nudge.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tiredithumans/crt-query'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # The URL goes through env rather than ${{ }} in the script, so no
        # PR-controlled text is ever spliced into shell.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
